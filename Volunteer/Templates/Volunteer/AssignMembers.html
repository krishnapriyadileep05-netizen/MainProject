<!DOCTYPE html>
<html>
<head>
    <title>Assign Members</title>
</head>
<body>

<h2 align="center">Assign Team Members</h2>

<form method="post">
    {% csrf_token %}

    <table border="1" align="center">
        <tr>
            <th>Select</th>
            <th>Name</th>
            <th>Contact</th>
        </tr>

        {% for i in teamdata %}
        <tr>
            <td>
                <input type="checkbox" name="team_id" value="{{ i.id }}"
                {% for a in assigned %}
                    {% if a.team_id.id == i.id %} checked disabled {% endif %}
                {% endfor %}
                >
            </td>
            <td>{{ i.team_name }}</td>
            <td>{{ i.team_contact }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <center>
        <input type="submit" value="Assign Selected Members">
        <br><br>
        <a href="{% url 'Volunteer:Team' %}">➕ Add New Member</a>
    </center>

</form>

</body>
</html>
