<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Members</title>
</head>

<body>

    <h2 style="text-align: center;">Volunteer List</h2>

    <table border="1" align="center">
        <tr>
            <th>SI.NO</th>
            <th>Name</th>
            <th>Contact</th>
        </tr>

        {% for i in memberdata %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.team_id.team_name }}</td>
            <td>{{ i.team_id.team_contact }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" align="center">No Members Assigned</td>
        </tr>
        {% endfor %}
    </table>


</body>

</html>
