<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Members</title>
</head>

<body>
<form action="" method="post" enctype="multipart/form-data">
    <h2 style="text-align: center;">Volunteer List</h2>

    <table border="1" align="center">
        <tr>
            <th>SI.NO</th>
            <th>Name</th>
            <th>Photo</th>
            <th>Address</th>
            <th>Contact</th>
        </tr>

        {% for i in memberdata %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.team_id.team_name }}</td>
           <td><img src="{{ i.team_id.volunteer_id.volunteer_photo.url }}" width="80" height="80" alt=""></td>
            <td>{{ i.team_id.team_address }}</td>
            <td>{{ i.team_id.team_contact }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" align="center">No Members Assigned</td>
        </tr>
        {% endfor %}
    </table>
</form>

</body>

</html>
